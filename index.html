<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Text Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    .heart-container {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      animation: rotate3D 15s infinite linear;
    }

    @keyframes rotate3D {
      0% {
        transform: rotateX(10deg) rotateY(0deg);
      }
      50% {
        transform: rotateX(-15deg) rotateY(180deg);
      }
      100% {
        transform: rotateX(10deg) rotateY(360deg);
      }
    }

    .text-stream {
      position: absolute;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 0 5px #fff, 0 0 10px #ff69b4, 0 0 15px #ff1493;
      user-select: none;
      /* Đường dẫn chạy theo hình trái tim */
      offset-path: path("M 250,150 C 250,80 180,30 110,80 C 40,130 40,210 120,290 C 180,350 250,410 250,430 C 250,410 320,350 380,290 C 460,210 460,130 390,80 C 320,30 250,80 250,150 Z");
      animation: streamAlong 6s infinite linear;
    }

    @keyframes streamAlong {
      0% {
        offset-distance: 0%;
      }
      100% {
        offset-distance: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="heart-container" id="heart"></div>

  <script>
    const container = document.getElementById('heart');
    const totalLines = 80; // Số lượng dòng chữ chạy nối đuôi nhau

    for (let i = 0; i < totalLines; i++) {
      const span = document.createElement('span');
      span.className = 'text-stream';
      span.innerText = 'I love you ';
      
      // Tạo hiệu ứng trễ thời gian để các chữ chạy nối tiếp nhau tạo thành hình
      const delay = (i / totalLines) * -6;
      span.style.animationDelay = `${delay}s`;

      // Tạo góc xoay 3D nhẹ giữa các lớp chữ để tạo độ dày khối 3D
      const zOffset = (Math.sin((i / totalLines) * Math.PI * 2) * 50);
      const rotateY = (i / totalLines) * 360;
      
      span.style.transform = `translateZ(${zOffset}px) rotateY(${rotateY / 4}deg)`;

      container.appendChild(span);
    }
  </script>

</body>
</html>
