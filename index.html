<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1000px;
    }

    .ui {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      transform: rotateX(-10deg) rotateY(0deg);
      animation: rotate 12s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotateX(-10deg) rotateY(0deg);
      }
      100% {
        transform: rotateX(-10deg) rotateY(360deg);
      }
    }

    .love {
      position: absolute;
      top: 0;
      left: 0;
      transform-style: preserve-3d;
      transform: rotateY(calc(var(--i) * (360deg / var(--total)))) translateZ(180px);
    }

    .love_horizontal {
      transform-style: preserve-3d;
      animation: heartScale 2s ease-in-out infinite alternate;
    }

    .love_vertical {
      transform-style: preserve-3d;
    }

    .love_word {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      color: #ff69b4;
      white-space: nowrap;
      text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ff1493;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="ui" id="ui"></div>

  <script>
    const ui = document.getElementById("ui");
    const totalItems = 60; // Số lượng dòng chữ xếp quanh hình trái tim
    ui.style.setProperty("--total", totalItems);

    for (let i = 1; i <= totalItems; i++) {
      const love = document.createElement("div");
      love.className = "love";
      love.style.setProperty("--i", i);

      // Công thức toán học tạo hình trái tim (Parametric Heart Equation)
      const t = (i / totalItems) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

      const scale = 12; // Độ lớn của trái tim

      love.innerHTML = `
        <div class="love_horizontal" style="transform: translate3d(${x * scale}px, ${y * scale}px, 0);">
          <div class="love_vertical">
            <div class="love_word">I love you</div>
          </div>
        </div>
      `;

      ui.appendChild(love);
    }
  </script>

</body>
</html>
